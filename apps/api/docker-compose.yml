services:
  blogs-api:
    build: .
    image: blogs-api:latest
    container_name: blogs-api
    restart: unless-stopped
    ports:
      - "8081:8081"

    # Everything that is a secret or a preference comes from .env beside this
    # file. The overrides below are paths that only make sense *inside* the
    # container, so they must not be taken from the host's .env.
    env_file:
      - .env

    environment:
      # The clone lives on a named volume, not wherever the host .env points.
      CONTENT_REPO_PATH: /var/lib/blog-content
      # Where the key is mounted below, regardless of its path on the host.
      CONTENT_SSH_KEY_PATH: /etc/blog-engine/deploy_key
      # SYNC_DAILY_SWEEP_AT is a local time, and a container is UTC unless told
      # otherwise. Without this, "03:00" means 03:00 UTC.
      TZ: ${TZ:-Asia/Kolkata}

    volumes:
      # Your existing SSH key, read-only. Nothing is written to it.
      # SSH_KEY_HOST_PATH is the path on the VM; it is deliberately a different
      # name from CONTENT_SSH_KEY_PATH, which is the path inside the container.
      - ${SSH_KEY_HOST_PATH:-/home/deploy/.ssh/id_ed25519}:/etc/blog-engine/deploy_key:ro
      # The working clone. Keeping it on a volume means a redeploy reuses the
      # clone instead of re-cloning the whole history on every start.
      - blog-content:/var/lib/blog-content

    healthcheck:
      # This only proves the process is serving HTTP. /api/health returns 200
      # even when the content sync is broken, by design — a GitHub outage must
      # not restart the container. To check the sync itself, read the "posts"
      # and "headSha" fields, or GET /api/admin/sync/status with an admin token.
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/api/health"]
      interval: 30s
      timeout: 5s
      # Generous: the very first start clones the repo before serving.
      start_period: 120s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  blog-content:

